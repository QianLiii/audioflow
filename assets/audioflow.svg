<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <title>AudioFlow</title>
  <!-- micro-microphone body: a stadium outline -->
  <rect x="46" y="14" width="36" height="64" rx="18" stroke="#2D7FF9" stroke-width="7"/>

  <!-- waveform inside the body -->
  <rect x="54.5" y="37" width="5" height="18" rx="2.5" fill="#2D7FF9"/>
  <rect x="61.5" y="31" width="5" height="30" rx="2.5" fill="#2D7FF9"/>
  <rect x="68.5" y="36" width="5" height="20" rx="2.5" fill="#2D7FF9"/>

  <!-- cradle: lower half circle -->
  <path d="M 32 56 A 32 32 0 0 0 96 56" stroke="#2D7FF9" stroke-width="7" stroke-linecap="round"/>

  <!-- stand and base -->
  <path d="M 64 88 L 64 104" stroke="#2D7FF9" stroke-width="7" stroke-linecap="round"/>
  <path d="M 48 110 L 80 110" stroke="#2D7FF9" stroke-width="7" stroke-linecap="round"/>
</svg>
